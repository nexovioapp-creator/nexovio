{% extends "base.html" %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">

        <h1>✅ Password Updated</h1>

        <p>
            Your Nexovio password has been successfully changed.
            You can now log in with your new password.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            Login Now
        </a>

    </div>
</div>

<style>
.auth-wrap{
    min-height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.auth-card{
    background:white;
    padding:40px;
    border-radius:20px;
    width:100%;
    max-width:500px;
    box-shadow:0 10px 40px rgba(0,0,0,0.08);
    text-align:center;
}

.auth-card h1{
    margin-bottom:15px;
}

.auth-card p{
    color:#64748b;
    line-height:1.6;
    margin-bottom:25px;
}

.login-btn{
    display:inline-block;
    padding:14px 28px;
    border-radius:12px;
    background:#4f46e5;
    color:white;
    text-decoration:none;
    font-weight:600;
}
</style>
{% endblock %}
