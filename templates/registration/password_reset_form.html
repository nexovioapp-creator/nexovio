{% extends "base.html" %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1>🔐 Reset Password</h1>
        <p>Enter your account email to receive reset instructions.</p>

        <form method="post">
            {% csrf_token %}
            {{ form.email }}

            <button type="submit">
                Send Reset Link
            </button>
        </form>
    </div>
</div>

<style>
.auth-wrap{
    min-height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.auth-card{
    background:white;
    padding:40px;
    border-radius:20px;
    width:100%;
    max-width:500px;
    box-shadow:0 10px 40px rgba(0,0,0,0.08);
}

.auth-card h1{
    margin-bottom:12px;
}

.auth-card p{
    color:#64748b;
    margin-bottom:20px;
}

.auth-card input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    margin-bottom:20px;
}

.auth-card button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#4f46e5;
    color:white;
    font-weight:600;
    cursor:pointer;
}
</style>
{% endblock %}
