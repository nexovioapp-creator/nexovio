{% extends "base.html" %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">

        <h1>🔑 Set New Password</h1>
        <p>Create a secure new password for your Nexovio account.</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                {{ form.new_password1 }}
            </div>

            <div class="form-group">
                {{ form.new_password2 }}
            </div>

            <button type="submit">
                Update Password
            </button>
        </form>

    </div>
</div>

<style>
.auth-wrap{
    min-height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.auth-card{
    background:white;
    padding:40px;
    border-radius:20px;
    width:100%;
    max-width:500px;
    box-shadow:0 10px 40px rgba(0,0,0,0.08);
    text-align:center;
}

.auth-card h1{
    margin-bottom:12px;
}

.auth-card p{
    color:#64748b;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.auth-card input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:15px;
}

.auth-card button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#4f46e5;
    color:white;
    font-weight:600;
    cursor:pointer;
    font-size:16px;
}
</style>
{% endblock %}
