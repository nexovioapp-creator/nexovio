{% extends "base.html" %}

{% block content %}

<section class="static-page-wrap">

    <div class="static-page-card">

        <h1>{{ page_title }}</h1>

        <div class="static-page-content">
            {{ page_content|linebreaks }}
        </div>

        <a href="/" class="btn">
            ← Back to Home
        </a>

    </div>

</section>

<style>
.static-page-wrap{
    padding:50px 20px;
    display:flex;
    justify-content:center;
}

.static-page-card{
    max-width:900px;
    width:100%;
    background:white;
    padding:40px;
    border-radius:24px;
    box-shadow:0 12px 32px rgba(0,0,0,0.08);
}

.static-page-card h1{
    margin-bottom:20px;
    font-size:36px;
}

.static-page-content{
    font-size:16px;
    line-height:1.8;
    color:#444;
    margin-bottom:30px;
}
</style>

{% endblock %}
